name: Garder le serveur Nova éveillé
# Le serveur gratuit Render s'endort après 15 min sans visite (premier chargement ~50 s).
# Un appel toutes les 10 minutes le garde réveillé (dépôt public : minutes GitHub Actions gratuites).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://nova-api-eo3i.onrender.com/api/health || true
