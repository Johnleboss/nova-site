ssion`,name:`Sur le terrain`,text:`Première mission validée.`,icon:`camera`},{id:`studio`,name:`Créatif`,text:`Premier visuel avec Nova Studio.`,icon:`palette`},{id:`eleve`,name:`Élève assidu`,text:`3 leçons de l’Académie terminées.`,icon:`book`},{id:`explorateur`,name:`Explorateur`,text:`Premier support ajouté au panier.`,icon:`map`},{id:`communaute`,name:`Communauté`,text:`Tu suis 5 comptes.`,icon:`users`}],Dc=[{id:`q-like`,title:`Encourage 3 publications`,hint:`Appuie sur le cœur`,goal:3,xp:15,on:`like`,link:`/`},{id:`q-lesson`,title:`Termine une leçon`,hint:`Académie · 3 min`,goal:1,xp:30,on:`lesson`,link:`/academie`},{id:`q-visuel`,title:`Crée un visuel`,hint:`Nova Studio, c’est gratuit`,goal:1,xp:25,on:`visuel`,link:`/studio`},{id:`q-mission`,title:`Accepte une mission`,hint:`Gagne de l’argent près de chez toi`,goal:1,xp:40,on:`mission`,link:`/missions`}],Oc=[{id:`l-message`,unit:`Les bases`,title:`Un message qui marque`,minutes:3,xp:30,cards:[`Une publicité ne dit qu’une chose. Choisis le bénéfice principal pour ton client : moins cher, plus proche, plus beau, plus rapide.`,`Parle comme tes clients. « Pagnes neufs à Bè » est plus clair que « Nouvelle collection textile premium ».`,`Termine toujours par une action : venir, appeler, écrire sur WhatsApp, réserver.`],quiz:[{q:`Combien d’idées principales dans une publicité ?`,options:[`Une seule`,`Trois`,`Autant que possible`],answer:0,why:`Un message, un bénéfice : c’est ce qu’on retient.`},{q:`Quelle fin de message est la meilleure ?`,options:[`« Merci de votre attention »`,`« Écrivez-nous sur WhatsApp au 90 00 00 00 »`,`« Qualité supérieure »`],answer:1,why:`Une action concrète et facile transforme l’attention en client.`}]},{id:`l-panneau`,unit:`Les bases`,title:`Réussir son panneau`,minutes:3,xp:30,cards:[`On regarde un panneau 3 secondes en moyenne. Vise 7 mots maximum.`,`Contraste fort : texte clair sur fond foncé, ou l’inverse. Le jaune sur blanc est illisible de loin.`,`Une image, un logo, un message. Le numéro de téléphone en grand si tu veux des appels.`],quiz:[{q:`Combien de mots viser sur un panneau ?`,options:[`7 maximum`,`20 environ`,`Peu importe`],answer:0,why:`Un automobiliste a environ 3 secondes pour lire.`},{q:`Quelle combinaison se lit le mieux de loin ?`,options:[`Jaune sur blanc`,`Blanc sur bleu nuit`,`Gris sur beige`],answer:1,why:`Le contraste fort reste lisible de loin et au soleil.`}]},{id:`l-budget`,unit:`Les bases`,title:`Bien répartir un petit budget`,minutes:4,xp:40,cards:[`Avec moins de 50 000 FCFA, concentre-toi sur ton quartier : créateurs locaux, tricycle, statut WhatsApp.`,`Répète le message : deux passages au même endroit valent mieux qu’un passage dans deux quartiers.`,`Garde une petite part pour mesurer : demande à chaque client comment il t’a connu.`],quiz:[{q:`Avec 20 000 FCFA, que faut-il privilégier ?`,options:[`Un spot télé`,`Le quartier : créateurs locaux et terrain`,`Un panneau à l’autre bout de la ville`],answer:1,why:`Un petit budget est plus efficace concentré près des clients.`},{q:`Pourquoi répéter le message ?`,options:[`On retient ce qu’on voit plusieurs fois`,`Pour dépenser plus`,`Ça ne sert à rien`],answer:0,why:`La répétition crée la mémorisation.`}]},{id:`l-createurs`,unit:`Aller plus loin`,title:`Travailler avec des créateurs`,minutes:4,xp:40,cards:[`Un créateur local avec 8 000 abonnés engagés vaut souvent mieux qu’un compte à 100 000 abonnés éloigné de tes clients.`,`Regarde le badge « statistiques vérifiées » : Nova contrôle la portée réelle des publications.`,`Laisse le créateur parler à sa façon. Donne-lui le message clé, pas un texte à lire.`],quiz:[{q:`Quel créateur choisir pour une boutique à Bè ?`,options:[`Un créateur de Bè très suivi localement`,`Le plus gros compte du pays`,`Celui qui publie le moins`],answer:0,why:`La proximité avec tes clients compte plus que le nombre total d’abonnés.`},{q:`Que vérifie le badge « statistiques vérifiées » ?`,options:[`La couleur du profil`,`La portée réelle des publicat
